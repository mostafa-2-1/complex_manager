
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
  <div class="container-fluid px-4">

    <!-- ── Brand ──────────────────────────────────────────── -->
    <a
      class="navbar-brand fw-bold d-flex align-items-center gap-2"
      routerLink="/dashboard"
      (click)="closeMenu()"
    >
      <span style="font-size: 1.3rem;">🏢</span>
      <span>ResidentialApp</span>
    </a>

    <!-- ── Mobile Toggle ──────────────────────────────────── -->
    <button
      class="navbar-toggler border-0"
      type="button"
      (click)="toggleMenu()"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- ── Collapsible Content ────────────────────────────── -->
    <div
      class="collapse navbar-collapse"
      [class.show]="menuOpen"
    >

      <!-- Nav Links -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item" *ngFor="let link of navLinks">
          <a
            class="nav-link d-flex align-items-center gap-1 px-3"
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.path === '/dashboard' }"
            (click)="closeMenu()"
          >
            <span>{{ link.icon }}</span>
            <span>{{ link.label }}</span>
          </a>
        </li>
      </ul>

      <!-- Right Side — User Info + Logout -->
      <div class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center gap-2 py-2 py-lg-0">

        <!-- User Info -->
        <div class="d-flex flex-column align-items-start align-items-lg-end">
          <span class="text-white fw-semibold small">
            {{ fullName() }}
          </span>
          <span [class]="roleBadgeClass()" style="font-size: 0.7rem;">
            {{ roleLabel() }}
          </span>
        </div>

        <!-- Divider (desktop only) -->
        <div class="vr bg-secondary mx-2 d-none d-lg-block" style="height: 32px;"></div>

        <!-- Logout Button -->
        <button
          class="btn btn-outline-light btn-sm"
          (click)="onLogout()"
        >
          Sign Out
        </button>

      </div>
    </div>

  </div>
</nav>
