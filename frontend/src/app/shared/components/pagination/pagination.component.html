<div
  *ngIf="pagination && pagination.pages > 1"
  class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 mt-3"
>

  <span class="text-muted small">
    Showing
    <strong>{{ (currentPage - 1) * pagination.per_page + 1 }}</strong>
    –
    <strong>{{ getDisplayEnd() }}</strong>
    of
    <strong>{{ pagination.total }}</strong>
    results
  </span>

  <nav aria-label="Pagination">
    <ul class="pagination pagination-sm mb-0">

      <li class="page-item" [class.disabled]="!pagination.has_prev">
        <button
          class="page-link"
          (click)="previous()"
          [disabled]="!pagination.has_prev"
          aria-label="Previous page"
        >
          ‹
        </button>
      </li>

      <ng-container *ngFor="let page of pageNumbers">

        <li *ngIf="page === null" class="page-item disabled">
          <span class="page-link">…</span>
        </li>

        <li
          *ngIf="page !== null"
          class="page-item"
          [class.active]="page === currentPage"
        >
          <button
            class="page-link"
            (click)="goToPage(page)"
            [attr.aria-current]="page === currentPage ? 'page' : null"
          >
            {{ page }}
          </button>
        </li>

      </ng-container>

      <li class="page-item" [class.disabled]="!pagination.has_next">
        <button
          class="page-link"
          (click)="next()"
          [disabled]="!pagination.has_next"
          aria-label="Next page"
        >
          ›
        </button>
      </li>

    </ul>
  </nav>

</div>
