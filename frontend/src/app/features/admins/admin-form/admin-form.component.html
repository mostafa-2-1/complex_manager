<div class="container" style="max-width: 720px;">

  <!-- HEADER -->
  <div class="page-header">
    <div class="d-flex align-items-center gap-3">
      <a routerLink="/admins" class="btn btn-outline-secondary btn-sm">← Back</a>
      <h2 class="mb-0">➕ Add Admin</h2>
    </div>
  </div>

  <!-- ALERTS -->
  @if (successMessage()) {
    <div class="alert alert-success">✅ {{ successMessage() }}</div>
  }

  @if (errorMessage()) {
    <div class="alert alert-danger">❌ {{ errorMessage() }}</div>
  }

  <!-- FORM -->
  <div class="card">
    <div class="card-header bg-primary text-white">
      Admin Information
    </div>

    <div class="card-body p-4">

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

        <div class="row g-3">

          <!-- CIVILITY -->
          <div class="col-md-3">
            <label class="form-label fw-semibold">Civility *</label>

            <select
              class="form-select"
              formControlName="civility"
              [class.is-invalid]="isInvalid('civility')">

              @for (c of civilityOptions; track c) {
                <option [value]="c">{{ c }}</option>
              }

            </select>
          </div>

          <!-- FIRST NAME -->
          <div class="col-md-4">
            <label class="form-label fw-semibold">First Name *</label>

            <input
              type="text"
              class="form-control"
              formControlName="first_name"
              placeholder="John"
              [class.is-invalid]="isInvalid('first_name')" />

            <div class="invalid-feedback">Min 2 characters required.</div>
          </div>

          <!-- LAST NAME -->
          <div class="col-md-5">
            <label class="form-label fw-semibold">Last Name *</label>

            <input
              type="text"
              class="form-control"
              formControlName="last_name"
              placeholder="Doe"
              [class.is-invalid]="isInvalid('last_name')" />

            <div class="invalid-feedback">Min 2 characters required.</div>
          </div>

          <!-- EMAIL -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Email *</label>

            <input
              type="email"
              class="form-control"
              formControlName="email"
              placeholder="john@example.com"
              [class.is-invalid]="isInvalid('email')" />

            <div class="invalid-feedback">Valid email required.</div>
          </div>

          <!-- PHONE -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Phone</label>

            <input
              type="tel"
              class="form-control"
              formControlName="phone"
              placeholder="+1 234 567 890" />
          </div>

          <!-- ROLE -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Role *</label>

            <select
              class="form-select"
              formControlName="role"
              [class.is-invalid]="isInvalid('role')">

              @for (r of roleOptions; track r.value) {
                <option [value]="r.value">{{ r.label }}</option>
              }

            </select>
          </div>

          <!-- STATUS -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Status *</label>

            <select class="form-select" formControlName="status">

              @for (s of statusOptions; track s.value) {
                <option [value]="s.value">{{ s.label }}</option>
              }

            </select>
          </div>

          <!-- PASSWORD -->
          <div class="col-12">
            <label class="form-label fw-semibold">Password *</label>

            <input
              type="password"
              class="form-control"
              formControlName="password"
              placeholder="Minimum 8 characters"
              autocomplete="new-password"
              [class.is-invalid]="isInvalid('password')" />

            <div class="invalid-feedback">
              Minimum 8 characters required.
            </div>
          </div>

        </div>

        <!-- ACTIONS -->
        <div class="d-flex gap-2 mt-4 pt-3 border-top">

          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="loading()">

            @if (loading()) {
              <span class="spinner-border spinner-border-sm me-2"></span>
            }

            {{ loading() ? 'Creating...' : 'Create Admin' }}
          </button>

          <a routerLink="/admins" class="btn btn-outline-secondary">
            Cancel
          </a>

        </div>

      </form>

    </div>
  </div>

</div>
